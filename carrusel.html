<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrusel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: lato;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(rgba(18, 25, 38, 0.68), rgba(18, 25, 38, 0.68)),
                url("img/fondo aot.png") center bottom / cover fixed no-repeat;
        }

        h2 {
            text-align: center;
            margin-top: 50px;
            font-size: 2rem;
            color: #fff;
        }

        .slider-frame {
            width: 100%;
            max-width: 700px;
            height: 350px;
            margin: 32px auto;
            overflow: hidden;
            background: transparent;
        }

        .carousel-footer {
            margin-top: auto;
            padding: 16px;
            color: #fff;
            background: #6c757d;
            text-align: center;
        }

        .carousel-footer p + p {
            margin-top: 6px;
        }

        .slider-frame ul {
            display: flex;
            height: 100%;
            padding: 0;
            width: 600%;
            animation: slide 20s infinite;
        }

        .slider-frame li {
            list-style: none;
            flex: 0 0 16.6667%;
            height: 100%;
        }

        .slider-frame img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 740px) {
            .slider-frame {
                width: 95%;
                height: 280px;
            }
        }

        @keyframes slide {
            0% { margin-left: 0%; }
            15% { margin-left: 0%; }
            20% { margin-left: -100%; }
            35% { margin-left: -100%; }
            40% { margin-left: -200%; }
            55% { margin-left: -200%; }
            60% { margin-left: -300%; }
            75% { margin-left: -300%; }
            80% { margin-left: -400%; }
            95% { margin-left: -400%; }
            100% { margin-left: -500%; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">Juegos y anime</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu-principal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="Juegos.html">Juegos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="carrusel.html" aria-current="page">Carrusel</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contactos.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <h2>Imagenes carrusel</h2>
    <div class="slider-frame">
        <ul>
            <li><img src="img/Peak aot.png" alt="Attack on Titan"></li>
            <li><img src="img/valorant.png" alt="VALORANT"></li>
            <li><img src="img/Minecraft.png" alt="Minecraft"></li>
            <li><img src="img/Mikasa.png" alt="Mikasa"></li>
            <li><img src="img/Armin.png" alt="Armin"></li>
            <li aria-hidden="true"><img src="img/Peak aot.png" alt=""></li>
        </ul>
    </div>
    <footer class="carousel-footer">
        <p>Carrusel de imágenes</p>
        <p>© 2026 Institut Barres i Ones</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
