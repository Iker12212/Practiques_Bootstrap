<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrusel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url("img/fondo aot.png") center bottom / cover fixed;
        }

        h1 { margin: 30px 0; color: white; text-align: center; }
        .slider-frame { max-width: 700px; height: 350px; margin: auto; overflow: hidden; }
        .slider-frame ul { display: flex; width: 600%; height: 100%; margin: 0; padding: 0; animation: pasar 20s infinite; }
        .slider-frame li { flex: 0 0 16.6667%; height: 100%; list-style: none; }
        .slider-frame img { width: 100%; height: 100%; object-fit: contain; }
        footer { position: fixed; right: 0; bottom: 0; left: 0; padding: 10px; background: #555; color: white; text-align: center; }
        footer p { margin: 5px; }
        @media (max-width: 740px) { .slider-frame { width: 95%; height: 280px; } }

        @keyframes pasar {
            0%, 15% { margin-left: 0; }
            20%, 35% { margin-left: -100%; }
            40%, 55% { margin-left: -200%; }
            60%, 75% { margin-left: -300%; }
            80%, 95% { margin-left: -400%; }
            100% { margin-left: -500%; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <a class="navbar-brand" href="index.html">Juegos y anime</a>

            </button>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Juegos.html">Juegos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="carrusel.html" aria-current="page">Carrusel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Contactos.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1>Imagenes carrusel</h1>
    <div class="slider-frame">
        <ul>
            <li><img src="img/Peak aot.png" alt="Attack on Titan"></li>
            <li><img src="img/valorant.png" alt="VALORANT"></li>
            <li><img src="img/Minecraft.png" alt="Minecraft"></li>
            <li><img src="img/Mikasa.png" alt="Mikasa"></li>
            <li><img src="img/Armin.png" alt="Armin"></li>
