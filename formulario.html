<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            overflow-x: hidden;
            color: #29334a;
            background-color: #f5f7fc;
            background-image:
                radial-gradient(ellipse at 12% 22%, rgba(196, 181, 253, 0.42), transparent 25rem),
                radial-gradient(ellipse at 88% 72%, rgba(147, 197, 253, 0.42), transparent 27rem),
                radial-gradient(ellipse at 72% 5%, rgba(253, 230, 138, 0.3), transparent 20rem);
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            border: 1px solid rgba(91, 83, 170, 0.16);
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        body::before {
            top: 17%;
            left: -8rem;
            width: 23rem;
            height: 23rem;
            box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.2), 0 0 0 48px rgba(255, 255, 255, 0.14);
        }

        body::after {
            right: -6rem;
            bottom: 3%;
            width: 19rem;
            height: 19rem;
            border-color: rgba(47, 126, 164, 0.17);
            box-shadow: 0 0 0 20px rgba(255, 255, 255, 0.2), 0 0 0 52px rgba(255, 255, 255, 0.13);
        }

        .navbar {
            position: relative;
            z-index: 1;
            background: #252b40 !important;
            box-shadow: 0 5px 22px rgba(37, 43, 64, 0.16);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .navbar .nav-link.active {
            color: #c7b9ff;
        }

        body > form {
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: 3.25rem auto;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 1.4rem;
            background: #fff;
            box-shadow: 0 24px 60px rgba(50, 61, 100, 0.13), 0 3px 12px rgba(50, 61, 100, 0.05);
        }

        body > form::before {
            display: block;
            margin-bottom: 1.8rem;
            padding-bottom: 1.1rem;
            border-bottom: 1px solid #eaedf5;
            color: #283452;
            content: "Formulario";
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        body > form::after {
            position: absolute;
            top: 0;
            left: 2.5rem;
            width: 4rem;
            height: 4px;
            border-radius: 0 0 4px 4px;
            background: #6554c0;
            content: "";
        }

        body > form .form-label {
            color: #34405c;
            font-weight: 600;
        }

        body > form .form-control {
            border-color: #dce1ec;
            border-radius: 0.7rem;
            padding: 0.72rem 0.85rem;
            color: #29334a;
            background-color: #fbfcff;
            transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
        }

        body > form .form-control:hover {
            border-color: #b9b1e4;
        }

        body > form .form-control:focus {
            border-color: #7768c8;
            background-color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(101, 84, 192, 0.13);
        }

        body > form .form-text {
            color: #788198;
        }

        body > form .form-check-input {
            cursor: pointer;
            border-color: #b7bfd0;
        }

        body > form .form-check-input:checked {
            border-color: #6554c0;
            background-color: #6554c0;
        }

        body > form .form-check-input:focus {
            border-color: #7768c8;
            box-shadow: 0 0 0 0.2rem rgba(101, 84, 192, 0.13);
        }

        body > form .form-check-label {
            cursor: pointer;
            color: #414b63;
        }

        body > form .form-check {
            flex: 1 1 auto;
            min-width: max-content;
            padding: 0.55rem 0.8rem 0.55rem 2rem;
            border: 1px solid #e5e8f0;
            border-radius: 0.65rem;
            background-color: #fbfcff;
            transition: border-color 160ms ease, background-color 160ms ease;
        }

        body > form .form-check:has(.form-check-input:checked) {
            border-color: #c8c0eb;
            background-color: #f5f3fc;
        }

        body > form .info-details {
            margin-top: 1.5rem;
        }

        body > form .info-details summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border: 1px solid #dce1ec;
            border-radius: 0.7rem;
            color: #34405c;
            background: #fbfcff;
            cursor: pointer;
            font-weight: 600;
            list-style: none;
            transition: border-color 160ms ease, background-color 160ms ease;
        }

        body > form .info-details summary::-webkit-details-marker {
            display: none;
        }

        body > form .info-details summary::after {
            color: #6554c0;
            content: "+";
            font-size: 1.35rem;
            line-height: 1;
        }

        body > form .info-details[open] summary::after {
            content: "\2212";
        }

        body > form .info-details summary:hover,
        body > form .info-details[open] summary {
            border-color: #b9b1e4;
            background: #f7f5ff;
        }

        body > form .info-options {
            display: grid;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding: 0.85rem;
            border: 1px solid #eaedf5;
            border-radius: 0.8rem;
            background: #f8f9fd;
        }

        body > form .info-options .form-check {
            width: 100%;
            min-width: 0;
            flex: none;
            margin: 0;
            background: #fff;
        }

        body > form .btn {
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.8rem;
            border: 0;
            border-radius: 0.7rem;
            color: #fff;
            background: #6554c0;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 7px 16px rgba(101, 84, 192, 0.2);
            transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
        }

        body > form .btn:hover {
            transform: translateY(-2px);
            color: #fff;
            background: #5141a8;
            box-shadow: 0 10px 22px rgba(101, 84, 192, 0.27);
        }

        @media (max-width: 576px) {
            body > form {
                margin: 1.75rem 1rem;
                padding: 2rem 1.4rem 1.5rem;
            }

            body > form::after {
                left: 1.4rem;
            }

            body > form::before {
                font-size: 1.45rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body > form .form-control,
            body > form .form-check,
            body > form .info-details summary,
            body > form .btn {
                transition: none;
            }
        }
    </style>
</head>
<body>

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu-principal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                    <li class="nav-item">

 <form>
    <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">Escribe aqui tu nombre.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Apellidos</label>
    <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">Escribe aqui tus apellidos.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Correo electrónico</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">Escribe aqui tu correo electrónico.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Fecha de nacimiento</label>
    <input type="date" class="form-control" id="exampleInputPassword1">
    <div id="dateHelp" class="form-text">Escribe aqui tu fecha de nacimiento.</div>
  </div>
  <fieldset class="mb-4">
    <label class="form-label">Género</label>
    <div class="d-flex flex-wrap gap-3">
      <div class="form-check">
        <input type="radio" class="form-check-input" id="genero-hombre" name="genero" value="hombre">
        <label class="form-check-label" for="genero-hombre">Hombre</label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="genero-mujer" name="genero" value="mujer">
        <label class="form-check-label" for="genero-mujer">Mujer</label>
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="genero-no-responder" name="genero" value="prefiero-no-responder">
        <label class="form-check-label" for="genero-no-responder">Prefiero no responder</label>
      </div>
    </div>
  </fieldset>
  <div class="mb-3">
    <label class="form-label" for="autoSizingSelect">Tipo de información</label>
    <select class="form-select" id="autoSizingSelect">
      <option selected>Elige una opción</option>
      <option value="1">Información general</option>
      <option value="2">Soporte técnico</option>
      <option value="3">Recomendaciones</option>
    </select>
  </div>
  <div class="form-floating mt-4 mb-3">
    <textarea class="form-control" placeholder="Escribe tus comentarios" id="floatingTextarea"></textarea>
    <label for="floatingTextarea">Comentarios</label>
  </div>
  <button type="submit" class="btn btn-primary">Confirmar</button>
</form>
